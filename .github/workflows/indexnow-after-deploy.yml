name: Notify IndexNow after production deployment

on:
  push:
    branches: [codex/prodclub-vip]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: prodclub-indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify production and submit changed articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/seo-geo/indexnow-after-deploy.py
